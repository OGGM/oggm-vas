[build-system]
requires = ["hatchling >= 1.26", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "oggm-vas"
dynamic = ["version"]
authors = [
{ name = "Moritz Oberrauch & OGGM Contributors", email = "info@oggm.org"}
]
description = "Open Global Glacier Model - VAS package"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["geosciences", "glaciers", "climate"]
# oggm-vas needs the unreleased OGGM master (gdir.settings, the new
# calibration): 1.6.3 will not work.
dependencies = [
    "oggm >= 1.6.4.dev",
    "numpy",
    "pandas",
    "scipy",
    "xarray",
    "scikit-learn",
]

[project.optional-dependencies]
tests = [
    "pytest",
    "geopandas",
]

[project.urls]
"Homepage" = "https://oggm.org"
"Bug Tracker" = "https://github.com/OGGM/oggm-vas/issues"

[tool.hatch.build.targets.sdist]
packages = ["oggm_vas"]

[tool.hatch.build.targets.wheel]
packages = ["oggm_vas"]

[tool.hatch.version]
source = "vcs"
# No release tag yet: without this, a build from a tagless clone fails
fallback-version = "0.0.1.dev0"
